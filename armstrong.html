<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armstrong Pressure Washing &amp; Roof Cleaning</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  /* overwritten from BIZ.colors at runtime */
  --primary:#0A4FA3; --sky:#2BA8EC; --accent:#4FD8F0; --deep:#082C57; --deep-rgb:8,44,87;
  --ink:#0B1C2E; --muted:#4F6276; --mist:#EEF7FC; --line:#D2E3EE;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:#fff;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
ul{list-style:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.sign{font-style:italic;font-weight:900;font-stretch:118%;letter-spacing:-.015em;line-height:.94}

.notice{background:var(--ink);color:#fff;font-size:14px;padding:9px 20px;text-align:center;position:relative;z-index:6}
.notice b{color:var(--accent);font-weight:600}

/* ---------- hero: pinned, scroll-washed ---------- */
.track{position:relative;height:185vh;height:185svh}
.hero{position:sticky;top:0;height:100vh;height:100svh;min-height:520px;overflow:hidden;color:#fff;
  background:linear-gradient(180deg,#69AEE4 0%,#CFE9F8 70%,#6FA658 70%)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(var(--deep-rgb),.95) 0%,rgba(var(--deep-rgb),.9) 26%,rgba(var(--deep-rgb),.62) 41%,rgba(var(--deep-rgb),.18) 53%,rgba(var(--deep-rgb),0) 62%)}
.nav{position:absolute;top:0;left:0;right:0;z-index:3}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:50px;height:50px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.brand .name{font-size:18px;color:#fff;-webkit-text-stroke:3px var(--primary);paint-order:stroke fill}
.nav .call{font-weight:600;text-decoration:none;background:rgba(255,255,255,.94);color:var(--deep);padding:10px 18px;border-radius:999px;font-size:15px;box-shadow:0 6px 20px -8px rgba(0,0,0,.5)}
.nav .call:hover{background:#fff}

.hero-copy{position:absolute;z-index:2;left:0;right:0;top:50%;transform:translateY(-46%)}
.hero-copy .inner{max-width:500px}
.kick{font-weight:600;font-size:15px;color:#BFEFFB;letter-spacing:.01em}
.hero h1{font-size:clamp(42px,5.6vw,78px);margin-top:14px;color:#fff;
  -webkit-text-stroke:.11em var(--primary);paint-order:stroke fill;text-shadow:.045em .055em 0 rgba(var(--deep-rgb),.9)}
.lede{margin-top:22px;font-size:clamp(17px,1.5vw,20px);max-width:33ch;color:#E2F4FC;line-height:1.45}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 24px;border-radius:12px;font:600 17px/1.2 var(--font);text-decoration:none;border:2px solid transparent;cursor:pointer;transition:background .15s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn-accent{background:var(--accent);color:var(--deep)}
.btn-accent:hover{background:#fff}
.btn-ghost{border-color:rgba(255,255,255,.75);color:#fff;background:rgba(var(--deep-rgb),.35)}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.btn-accent::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);opacity:0}
.ticks{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:24px;font-weight:600;font-size:15px;color:#D5F1FB}
.ticks li{display:flex;align-items:center;gap:7px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
.ticks li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.is-clean .ticks li{opacity:1;transform:none}
.is-clean .ticks li:nth-child(2){transition-delay:.09s}.is-clean .ticks li:nth-child(3){transition-delay:.18s}
.is-clean .ticks li:nth-child(4){transition-delay:.27s}.is-clean .ticks li:nth-child(5){transition-delay:.36s}
.is-clean .btn-accent::after{animation:sheen 1s .35s ease-out 1}
@keyframes sheen{0%{left:-60%;opacity:1}100%{left:130%;opacity:1}}

.washctl{position:absolute;z-index:3;right:24px;bottom:58px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.92);color:var(--deep);
  border:0;border-radius:999px;padding:7px 15px 7px 8px;font:600 14px/1 var(--font);cursor:pointer;box-shadow:0 8px 24px -10px rgba(0,0,0,.55)}
.washctl:hover{background:#fff}
.washctl svg{width:24px;height:24px;transform:rotate(-90deg)}
.washctl circle{fill:none;stroke-width:3.2}
.washctl .bg{stroke:rgba(var(--deep-rgb),.16)}
.washctl .fg{stroke:var(--primary);stroke-linecap:round;stroke-dasharray:56.5;stroke-dashoffset:56.5}
.rm-line,.rm-tag{display:none}
.hero.static .rm-line{display:block;position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(var(--deep-rgb),.25);z-index:1}
.hero.static .rm-tag{display:block;position:absolute;z-index:2;padding:5px 11px;border-radius:8px;font-weight:600;font-size:13px;background:rgba(11,28,46,.8);color:#fff;transform:translateX(-50%)}

@media (max-width:760px){
  .wrap{padding:0 20px}
  .track{height:170vh;height:170svh}
  .scrim{background:linear-gradient(180deg,rgba(var(--deep-rgb),.96) 0%,rgba(var(--deep-rgb),.92) 41%,rgba(var(--deep-rgb),.55) 48.5%,rgba(var(--deep-rgb),.12) 53%,rgba(var(--deep-rgb),0) 57%)}
  .nav .call{display:none}
  .brand svg{width:42px;height:42px}
  .brand .name{font-size:15px}
  .hero-copy{top:78px;transform:none}
  .hero h1{font-size:clamp(38px,11.4vw,54px);margin-top:8px}
  .lede{margin-top:14px;font-size:16.5px;max-width:30ch}
  .cta{margin-top:18px;gap:10px}
  .cta .btn{padding:14px 8px;font-size:15.5px;flex:1;white-space:nowrap}
  .ticks{display:none}
  .washctl{right:14px;bottom:148px}
}
@media (max-height:560px) and (min-width:761px){.lede{display:none}.hero h1{font-size:clamp(34px,5vw,54px)}}

/* ---------- shared ---------- */
.h2{font-size:clamp(40px,6vw,84px);color:var(--primary)}
.btn-dark{background:var(--deep);color:#fff}
.btn-dark:hover{background:var(--primary)}
.btn-line{border-color:var(--deep);color:var(--deep);background:transparent}
.btn-line:hover{background:rgba(255,255,255,.5)}
.tagchip{position:absolute;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;line-height:1.2;background:rgba(8,16,28,.72);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* ---------- services: pinned stage, each scene washes as you scroll ---------- */
.svc{background:var(--grain),var(--deep);color:#fff;position:relative}
.svc-head{padding-top:124px;padding-bottom:8px}
.svc-head .fitrow{line-height:.9}
.svc-head h2{display:inline-block;white-space:nowrap;font-size:80px;line-height:1;color:#fff;-webkit-text-stroke:.075em var(--primary);paint-order:stroke fill;padding:0 .06em 0 .04em;margin-left:-.04em}
.svc-head p{max-width:34ch;color:rgba(255,255,255,.76);font-size:20px;line-height:1.4;margin-top:22px}
.svc-track{height:calc(var(--n) * 68vh + 100vh)}
.svc-pin{position:sticky;top:0;height:100vh;height:100svh;display:flex;align-items:center}
.svc-grid{width:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:center;
  padding-left:max(28px,calc((100vw - 1180px)/2 + 28px))}
.svc-list li{border-top:1px solid rgba(255,255,255,.16);padding:15px 0 16px;position:relative}
.svc-list li::before{content:"";position:absolute;left:0;top:-1px;height:3px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.svc-list li.on::before{transform:none}
.svc-list button{font-family:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;display:block;width:100%;
  font-size:clamp(22px,2.45vw,35px);color:rgba(255,255,255,.36);transition:color .3s}
.svc-list button:hover{color:rgba(255,255,255,.7)}
.svc-list li.on button{color:#fff}
.svc-list .d{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.svc-list li.on .d{grid-template-rows:1fr}
.svc-list .d p{overflow:hidden;color:rgba(255,255,255,.8);max-width:34ch;font-size:18px;line-height:1.45}
.svc-list li.on .d p{padding-top:8px}
.stage{position:relative;height:min(78vh,740px);border-radius:30px 0 0 30px;overflow:hidden;background:rgba(255,255,255,.06);box-shadow:0 50px 90px -50px rgba(0,0,0,.8)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .state{left:18px;top:18px}
.stage .illus{right:18px;bottom:18px;font-weight:500;opacity:.85}
.svc-count{display:none}
.svc-end{height:96px}
@media (max-width:860px){
  .svc-head{padding-top:84px}
  .svc-head p{font-size:17px}
  .svc-track{height:calc(var(--n) * 62vh + 100vh)}
  .svc-pin{align-items:flex-start}
  .svc-grid{grid-template-columns:1fr;gap:18px;padding:14px 20px 0}
  .stage{order:-1;height:54vh;height:54svh;border-radius:22px}
  .svc-list li{display:none;border:0;padding:0}
  .svc-list li::before{display:none}
  .svc-list li.on{display:block;animation:svcin .35s ease both}
  .svc-list button{font-size:30px;line-height:1.02}
  .svc-list .d p{font-size:17px}
  .svc-count{display:flex;gap:6px;margin-bottom:14px}
  .svc-count i{height:4px;flex:1;border-radius:2px;background:rgba(255,255,255,.2)}
  .svc-count i.on{background:var(--accent)}
  .svc-end{height:40px}
}
@keyframes svcin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* reduced motion: every service shown at once with a still dirty/clean split */
.svc-static{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 40px;padding-top:56px;padding-bottom:110px}
.svc-static figure{margin:0}
.svc-static figure:nth-child(even){margin-top:72px}
.svc-static .pic{position:relative;aspect-ratio:16/10;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.06)}
.svc-static canvas{width:100%;height:100%;display:block;object-fit:cover}
.svc-static .tagchip{top:12px}.svc-static .tagchip.l{left:12px}.svc-static .tagchip.r{right:12px}
.svc-static h3{font-size:28px;margin-top:18px}
.svc-static p{color:rgba(255,255,255,.8);margin-top:6px;max-width:36ch}
@media (max-width:700px){.svc-static{grid-template-columns:1fr;gap:40px}.svc-static figure:nth-child(even){margin-top:0}}

/* ---------- where we work ---------- */
.where{background:var(--grain),var(--mist);padding:150px 0 130px;position:relative;overflow:hidden}
.where-lead{font-weight:600;font-size:19px;color:var(--primary)}
.places{font-size:clamp(34px,6vw,86px);line-height:1;margin-top:18px}
.places.few{font-size:clamp(42px,9vw,128px);line-height:.94}
.places.few span{display:block}
.places.few i{display:none}
.places span{padding-right:.06em;color:transparent;-webkit-background-clip:text;background-clip:text;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background-image:linear-gradient(100deg,var(--primary) 0 44%,#8E8868 56% 100%);background-size:240% 100%;background-position:100% 0;
  transition:background-position 1.1s cubic-bezier(.3,.7,.2,1);transition-delay:calc(var(--i) * 110ms + 150ms)}
.places.in span{background-position:0 0}
.places i{font-style:normal;font-weight:300;color:var(--sky);margin:0 .12em;opacity:.7}
.where-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 24px;margin-top:84px;align-items:start}
.why{grid-column:1 / span 6;border-top:3px solid var(--primary);padding-top:26px}
.why h3{font-size:clamp(28px,3.2vw,42px);color:var(--primary)}
.why p{font-size:20px;line-height:1.5;max-width:40ch;margin-top:16px}
.why p + p{margin-top:12px}
.where-side{grid-column:8 / span 5;position:relative;padding-top:26px;border-top:3px solid var(--primary)}
.sticker{float:right;width:190px;height:190px;margin:-78px -6px 10px 22px;border-radius:50%;background:var(--accent);color:var(--deep);display:grid;place-content:center;text-align:center;
  transform:rotate(9deg);padding:20px;box-shadow:0 22px 40px -22px rgba(var(--deep-rgb),.75),inset 0 0 0 7px var(--accent),inset 0 0 0 9px rgba(var(--deep-rgb),.5);transition:transform .5s cubic-bezier(.3,1.6,.4,1)}
.sticker:hover{transform:rotate(-4deg) scale(1.05)}
.sticker b{font-size:46px;line-height:.9}
.sticker.long b{font-size:30px}
.offer-text{font-weight:600;font-size:21px;line-height:1.35;color:var(--deep);max-width:24ch}
.where-side .note{font-size:18px;max-width:30ch}
.where-side .btn{margin-top:24px}
@media (max-width:860px){
  .where{padding:88px 0 80px}
  .where-grid{display:block;margin-top:52px}
  .where-side{margin-top:54px}
  .sticker{width:150px;height:150px;margin:-64px 0 6px 16px}
  .sticker b{font-size:36px}.sticker.long b{font-size:24px}
  .why p{font-size:18px}
}

/* ---------- before / after ---------- */
.work{padding:130px 0 140px;background:#fff}
.work-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 48px;flex-wrap:wrap}
.work-head p{max-width:30ch;font-size:18px;line-height:1.45;padding-bottom:.5em;color:var(--ink);opacity:.75}
.ba{position:relative;width:min(1400px,calc(100% - 40px));margin:44px auto 0;aspect-ratio:16/9;border-radius:28px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y;background:var(--mist);box-shadow:0 50px 80px -50px rgba(var(--deep-rgb),.7)}
.ba canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .dirty{clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.ba .tagchip{top:16px}.ba .tagchip.l{left:16px}.ba .tagchip.r{right:16px}
.ba .slot{left:16px;bottom:16px;top:auto;font-weight:500}
.ba .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 14px rgba(0,0,0,.4)}
.ba .knob{position:absolute;top:50%;left:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--primary);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;padding:0;border:0}
.ba:has(input:focus-visible){outline:3px solid var(--sky);outline-offset:4px}
@media (max-width:700px){.work{padding:80px 0 84px}.ba{aspect-ratio:4/5;border-radius:20px;width:calc(100% - 28px);margin-top:28px}}

/* ---------- contact ---------- */
.contact{background:var(--accent);color:var(--deep);padding:120px 0 120px;position:relative;overflow:hidden}
.contact h2{font-size:clamp(26px,3vw,40px);color:var(--deep)}
.phone-row{margin-top:10px;line-height:.9}
.big-phone{display:inline-block;white-space:nowrap;font-size:80px;color:var(--deep);text-decoration:none;transition:color .25s,-webkit-text-stroke-color .25s;-webkit-text-stroke:.035em var(--deep);paint-order:stroke fill;padding-right:.04em}
.big-phone:hover{color:#fff}
.contact-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 24px;margin-top:56px;align-items:start}
.contact-info{grid-column:1 / span 5}
.contact-info .blurb{font-size:22px;line-height:1.4;font-weight:500;max-width:24ch}
.contact .mail{display:inline-block;margin-top:14px;font-weight:600;word-break:break-word;text-underline-offset:4px}
.contact .cta{margin-top:26px}
.contact .perk-line{margin-top:30px;font-weight:700;font-stretch:108%;font-size:18px}
.contact form{grid-column:7 / span 6;background:#fff;border-radius:24px;padding:28px;display:grid;gap:16px;color:var(--ink)}
label{display:grid;gap:6px;font-weight:600;font-size:15px;color:var(--deep)}
input,select,textarea{font:400 17px/1.3 var(--font);padding:13px 14px;border:1.5px solid rgba(var(--deep-rgb),.28);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--deep);outline:none;box-shadow:0 0 0 3px rgba(var(--deep-rgb),.2)}
textarea{min-height:96px;resize:vertical}
form .btn{width:100%}
.form-note{font-size:14px;opacity:.75}
@media (max-width:860px){
  .contact{padding:76px 0 76px}
  .contact-grid{display:block;margin-top:34px}
  .contact form{margin-top:40px;padding:22px}
  .contact-info .blurb{font-size:20px}
}

/* ---------- footer ---------- */
footer{background:var(--grain),var(--ink);color:rgba(255,255,255,.66);padding:70px 0 40px;font-size:15px;overflow:hidden}
.foot-mark{display:inline-block;white-space:nowrap;font-size:80px;line-height:.9;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.3);padding-right:.05em}
.foot-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;margin-top:34px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16)}
footer b{color:#fff;font-weight:600}
footer .hash{color:var(--accent);font-weight:600}

.callbar{display:none}
@media (max-width:760px){
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));gap:10px;z-index:10}
  .callbar a{flex:1;box-shadow:0 10px 26px -8px rgba(0,0,0,.45)}
  .callbar .txt{background:#fff;color:var(--deep);border-color:var(--deep)}
  body{padding-bottom:88px;background:var(--ink)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .track{height:auto}
  .hero{position:relative}
  .ticks li,.btn,.places span,.sticker,.svc-list *{transition:none}
  .ticks li{opacity:1;transform:none}
  .is-clean .btn-accent::after{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======================================================================
   BIZ:START — everything business-specific lives in this one object.
   To make a page for another business, change only this block.
   ====================================================================== */
const BIZ = {
  name: 'Armstrong Pressure Washing & Roof Cleaning',
  nameLines: ['Armstrong', 'Pressure Washing & Roof Cleaning'],
  shortName: 'Armstrong',
  area: 'Nashville, Brentwood & Franklin',
  region: 'TN',
  kicker: 'Roof & house soft washing',
  hashtag: '',

  headline: 'Curb appeal, from the roof down.',
  lede: 'Roof soft washing, house washing, driveways and gutters for Brentwood, Franklin, Belle Meade and Nashville.',
  heroCta: 'Get a free quote',
  metaDescription: 'Armstrong Pressure Washing & Roof Cleaning. Roof soft wash, house washing, driveways, decks and gutters. Residential and commercial, fully insured. Free quotes: 615-818-6823.',

  phoneDisplay: '615-818-6823',
  phoneTel: '+16158186823',
  email: 'forestgarmstrong@gmail.com',

  colors: { primary: '#173C74', sky: '#3D7CC9', accent: '#8CCBF5', deep: '#0E2549', ink: '#0B1A2E' },
  logo: { style: 'initials', initials: 'A' },

  house: { siding: '#DCCFB2', trim: '#FFFFFF', shutters: '#2F3B33', door: '#4A2E22', roof: '#6B6156' },

  perks: ['Residential', 'Commercial', 'Fully insured'],
  heroExtraTick: 'Free quotes',
  discount: { big: 'Bundle & save', text: 'Ask about the Curb Appeal Package: combine services and save more.' },

  areasTitle: 'Where we work',
  areas: ['Oak Hill', 'Belle Meade', 'Forest Hills', 'Brentwood', 'Berry Hill', 'Arrington', 'West Meade', 'Thompson\'s Station', 'Nashville', 'Franklin'],
  logoImg: null,   // set to their real logo file once they say yes

  servicesTitle: 'What we clean',
  servicesIntro: 'Serving Oak Hill, Belle Meade, Forest Hills, Brentwood, Berry Hill, Franklin and the rest of Nashville.',
